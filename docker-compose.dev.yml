name: soho-backend
services:
    postgres:
        profiles: ["postgres", "db", "all"]
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
            - POSTGRES_DB=${POSTGRES_DB:-soho_db}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - soho-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    redis:
        profiles: ["redis", "db", "all"]
        image: redis:7-alpine
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - soho-redis-data:/data
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    minio:
        profiles: ["minio", "storage", "all"]
        image: minio/minio:latest
        ports:
            - "${MINIO_PORT:-9000}:9000"
            - "${MINIO_CONSOLE_PORT:-9001}:9001"
        environment:
            - MINIO_ROOT_USER=${ACCESS_KEY:-minioadmin}
            - MINIO_ROOT_PASSWORD=${SECRET_KEY:-minioadmin}
        volumes:
            - soho-minio-data:/data
        command: server /data --console-address ":9001"
        restart: unless-stopped

volumes:
    soho-postgres-data:
    soho-redis-data:
    soho-minio-data:
