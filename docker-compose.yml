services:
    app:
        build: .
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
            - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ugp_bos}?schema=public
            - LOKI_URL=http://loki:3100
            - LOKI_ENABLED=true
            - LOG_LEVEL=info
            - APP_NAME=ugp-bos
            - CORS_ORIGIN=${CORS_ORIGIN:-*}
            - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
            - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
            - REDIS_ENABLED=${REDIS_ENABLED:-false}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
            - STORAGE=${STORAGE:-minio}
            - BUCKET_NAME=${BUCKET_NAME}
            - ACCESS_KEY=${ACCESS_KEY}
            - SECRET_KEY=${SECRET_KEY}
            - AWS_REGION=${AWS_REGION:-us-east-1}
            - ENDPOINT=${ENDPOINT}
            - ROADRUSH_USERNAME=${ROADRUSH_USERNAME}
            - ROADRUSH_PASSWORD=${ROADRUSH_PASSWORD}
            - LICENSE_KEY=${LICENSE_KEY:?LICENSE_KEY is required}
            - LICENSE_SERVICE_URL=${LICENSE_SERVICE_URL:?LICENSE_SERVICE_URL is required}
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            loki:
                condition: service_started
        restart: unless-stopped
        networks:
            - internal
            - external

    postgres:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            - POSTGRES_DB=${POSTGRES_DB:-ugp_bos}
        # Only expose postgres port in development; remove or comment out for production
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - internal

    redis:
        image: redis:7-alpine
        # Only expose redis port in development; remove or comment out for production
        ports:
          - "6379:6379"
        volumes:
            - redis-data:/data
        command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "redis-cli ${REDIS_PASSWORD:+--no-auth-warning -a ${REDIS_PASSWORD}} ping | grep -q PONG",
                ]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - internal

    loki:
        image: grafana/loki:2.9.0
        # Only expose loki port in development; remove or comment out for production
        ports:
          - "3100:3100"
        volumes:
            - loki-data:/loki
        command: -config.file=/etc/loki/local-config.yaml
        restart: unless-stopped
        networks:
            - internal

    grafana:
        image: grafana/grafana:10.2.0
        ports:
            - "3001:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
            - GF_USERS_ALLOW_SIGN_UP=false
        volumes:
            - grafana-data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning
        depends_on:
            - loki
        restart: unless-stopped
        networks:
            - internal
            - external

    adminer:
        image: adminer:latest
        restart: unless-stopped
        ports:
            - "8080:8080"
        networks:
            - internal

networks:
    internal:
        driver: bridge
    external:
        driver: bridge

volumes:
    postgres-data:
    redis-data:
    loki-data:
    grafana-data:
