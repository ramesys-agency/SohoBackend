services:
    app:
        build: .
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
            - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-ugp_bos}?schema=public
            - LOG_LEVEL=info
            - APP_NAME=ugp-bos
            - CORS_ORIGIN=${CORS_ORIGIN:-*}
            - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
            - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
            - REDIS_ENABLED=${REDIS_ENABLED:-false}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
            - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
            - STORAGE=${STORAGE:-minio}
            - BUCKET_NAME=${BUCKET_NAME}
            - ACCESS_KEY=${ACCESS_KEY}
            - SECRET_KEY=${SECRET_KEY}
            - AWS_REGION=${AWS_REGION:-us-east-1}
            - ENDPOINT=${ENDPOINT}
            - STORAGE_PUBLIC_ENDPOINT=${STORAGE_PUBLIC_ENDPOINT}
            - ROADRUSH_USERNAME=${ROADRUSH_USERNAME}
            - ROADRUSH_PASSWORD=${ROADRUSH_PASSWORD}
            - LICENSE_KEY=${LICENSE_KEY:?LICENSE_KEY is required}
            - LICENSE_SERVICE_URL=${LICENSE_SERVICE_URL:?LICENSE_SERVICE_URL is required}
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_started
        restart: unless-stopped
        # No `networks:` on purpose. Coolify creates one network per deployment and
        # attaches coolify-proxy to it, so Traefik has exactly one container IP to
        # target. Declaring custom networks puts the container on several at once and
        # Traefik picks one at random — land on the wrong one and every request to
        # api.soho-bd.com dies as a 504 after the 30s dial timeout (2026-08-31).
        # Adding `coolify` instead is worse: it breaks Docker's internal DNS, so the
        # bare hostname `postgres` resolves to Coolify's own database container and
        # the app dies on `password authentication failed for user "postgres"`.

    postgres:
        image: postgres:16-alpine
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            - POSTGRES_DB=${POSTGRES_DB:-ugp_bos}
        # Only expose postgres port in development; remove or comment out for production
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        # Only expose redis port in development; remove or comment out for production
        ports:
          - "6379:6379"
        volumes:
            - redis-data:/data
        command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "redis-cli ${REDIS_PASSWORD:+--no-auth-warning -a ${REDIS_PASSWORD}} ping | grep -q PONG",
                ]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    minio:
        image: minio/minio:latest
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            - MINIO_ROOT_USER=${ACCESS_KEY:-minioadmin}
            - MINIO_ROOT_PASSWORD=${SECRET_KEY:-minioadmin}
        volumes:
            - minio-data:/data
        command: server /data --console-address ":9001"
        restart: unless-stopped
        labels:
            # Force Traefik to route minio.soho-bd.com to port 9000 (S3 API),
            # NOT port 9001 (MinIO Console UI).
            - "traefik.http.services.minio-s3.loadbalancer.server.port=9000"

volumes:
    postgres-data:
    redis-data:
    minio-data:
